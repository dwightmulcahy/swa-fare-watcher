email:
  to: [you@example.com]
  on_error: true            # email if every search fails (blocked / session expired)

browser:
  headless: false           # headed is far less likely to be blocked; use xvfb-run on servers
  channel: chrome           # use installed Google Chrome; remove to use bundled Chromium
  delay_sec: [8, 20]        # random pause between searches

defaults:                   # applied to every route unless overridden
  adults: 1
  max_stops: 1
  max_duration_min: 360
  max_price: 250            # USD, total one-way
  max_points: 15000
  min_cpp: 1.3              # points fare qualifies / is recommended at >= this ¢ per point
  depart_after: "06:00"
  depart_before: "21:00"

routes:
  - origin: AUS
    destination: BWI
    dates: ["2026-12-18", "2026-12-19"]

  - origin: DAL
    destination: LAS
    days_ahead: [14, 45]    # rolling window
    weekdays: [fri, sat]    # limit dates to keep request count low
    max_stops: 0
    max_price: 150
