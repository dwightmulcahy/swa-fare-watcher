<!doctype html><title>Select departing flight</title>
<body><h1>Depart</h1>
<!-- Southwest's date strip (trimmed markup): every bookable day, scrolled sideways -->
<div aria-label="Flight date calendar"><div role="tablist" id="strip"
     style="display:flex; overflow-x:auto; width:600px; white-space:nowrap"></div></div>
<script>
// Asks for fares like the real page; on a day with no flights, Southwest sends you to the
// Low Fare Calendar with a "Wanna look for another day?" banner.
const q = new URLSearchParams(location.search);
window.shoppingCalls = [];
const fmt = (d, o) => d.toLocaleDateString("en-US", { timeZone: "UTC", ...o });
function strip(selected) {
  const box = document.getElementById("strip"), start = new Date("2026-12-20T00:00:00Z");
  box.replaceChildren();
  for (let i = 0; i < 90; i++) {
    const d = new Date(start.getTime() + i * 864e5), iso = d.toISOString().slice(0, 10);
    const b = document.createElement("button");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-label", fmt(d, { weekday: "long" }) + " " + fmt(d, { month: "long", day: "numeric" }));
    b.setAttribute("aria-selected", String(iso === selected));
    b.style.minWidth = "120px";
    const label = `<div>${fmt(d, { weekday: "short" })}</div><div>${fmt(d, { month: "short", day: "numeric" })}</div>`;
    b.innerHTML = `<div style="visibility:hidden;height:0">${label}</div><div>${label}</div>`;
    b.onclick = () => { q.set("departureDate", iso); history.pushState({}, "", "?" + q.toString()); load(); };
    box.append(b);
  }
}
function load() {
  const date = q.get("departureDate");
  strip(date);
  window.shoppingCalls.push(date);
  fetch("/api/air-booking/v1/air-booking/page/air/booking/shopping", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ fareType: q.get("fareType"), departureDate: date }) })
    .then((r) => r.json())
    .then((d) => { if (!d.data) location.replace("calendar.html?noflights=1&" + q.toString()); });
}
load();
</script>
