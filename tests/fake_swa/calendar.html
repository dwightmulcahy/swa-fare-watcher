<!doctype html><title>Low fare calendar</title>
<body>
<div id="banner" hidden><h2>Wanna look for another day?</h2>
  <p>We don't have any flights from San Jose, Costa Rica - SJO to Jacksonville, FL - JAX on 12/16/2026.</p></div>
<script>if (new URLSearchParams(location.search).get("noflights")) document.getElementById("banner").hidden = false;</script>
<h1>Low fare calendar</h1>
<!-- Southwest's real markup (trimmed) -->
<div><div>Shop in</div><div aria-label="Shop in" role="group"><div>
  <button aria-label="Select dollars currency" role="button" type="button" aria-pressed="true" data-ft="USD"><div><span>Dollars</span></div></button>
  <button aria-label="Select points currency" role="button" type="button" aria-pressed="false" data-ft="POINTS"><div><span>Points</span></div></button>
  <button aria-label="Select dollars plus points currency" role="button" type="button" aria-pressed="false" data-ft="MIX"><div><span>$ + Points</span></div></button>
</div></div></div>
<div role="tablist">
  <button role="tab" type="button" aria-label="November 2026" aria-selected="true" data-month="2026-11">NOV</button>
  <button role="tab" type="button" aria-label="December 2026" aria-selected="false" data-month="2026-12">DEC</button>
</div>
<script>
const q = new URLSearchParams(location.search);
window.calendarFetches = [];
const state = { ft: q.get("fareType") || "USD", month: "2026-11" };
const load = () => { window.calendarFetches.push(state.ft + " " + state.month);
  return fetch("calendar-data-" + state.ft + (state.month === "2026-11" ? "" : "-" + state.month) + ".json" + location.search); };
const buttons = document.querySelectorAll("[role=group] button");
buttons.forEach((b) => b.addEventListener("click", () => {
  buttons.forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  state.ft = b.dataset.ft; load();
}));
const tabs = document.querySelectorAll("[role=tab]");
tabs.forEach((t) => t.addEventListener("click", () => {
  tabs.forEach((x) => x.setAttribute("aria-selected", String(x === t)));
  state.month = t.dataset.month; load();
}));
// like the real page: build manifest and the signed-in user's account info first, then the fares
fetch("v2/air/low-fare-calendar/manifest.json")
  .then(() => fetch("api/security/userinfo.json"))
  .then(() => setTimeout(load, 300));
</script>
