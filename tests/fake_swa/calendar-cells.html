</div>

  <div role="gridcell"><button aria-label="Monday 30, $99">30</button></div></div></div></div>

  <div role="gridcell"><button aria-label="Tuesday 1, Unavailable" disabled>1</button></div>
  <div role="gridcell"><button aria-label="Saturday 19, $342  Selected depart date">19</button></div>
  <div role="gridcell"><button aria-label="Sunday 20, $418">20</button></div>
</div></div></div>
