# QNAP Container Station: pulls the published image (no local build)
services:
  watcher:
    image: ${IMAGE:?set IMAGE in .env}
    env_file:
      # relative to this file's folder. Container Station keeps pasted compose files in its own
      # folder, so use the full path to your .env there (e.g. /share/Container/swa-fare-watcher/.env)
      - path: .env
        required: true
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ${QNAP_DATA_DIR:-/share/Container/swa-fare-watcher/data}:/data
      # the same .env, so the admin Settings page can edit it (the app's user 1000 needs write access)
      - ${ENV_FILE:-./.env}:/config/.env
    # Optional GPU rendering (SWA_GPU=true in .env): pass the Intel GPU in. On the QNAP the device
    # is root-only, so once per boot (or from autorun.sh): chmod 666 /dev/dri/renderD128
    # devices:
    #   - /dev/dri:/dev/dri
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g
    shm_size: 512m
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
