<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fare Watcher{% endblock %} · Fare Watcher</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <img src="/static/favicon.svg" alt="" width="22" height="22">
      <span>Fare Watcher</span>
    </a>
    {% if user and not user.must_change_pw %}
    <nav>
      <a href="/" class="{{ 'on' if request.url.path == '/' or request.url.path.startswith('/watches') }}">Watches</a>
      <a href="/settings" class="{{ 'on' if request.url.path.startswith('/settings') }}">Settings</a>
      {% if user.is_admin %}<a href="/admin" class="{{ 'on' if request.url.path.startswith('/admin') }}">Admin</a>{% endif %}
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link" type="submit">Sign out <span class="muted">{{ user.username }}</span></button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% if msg %}<div class="flash ok" role="status">{{ msg }}</div>{% endif %}
    {% if err %}<div class="flash err" role="alert">{{ err }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
