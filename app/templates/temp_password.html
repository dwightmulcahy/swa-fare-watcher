{% extends "base.html" %}
{% block title %}Temporary password{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ 'User created' if created else 'Password reset' }}</h1>
  <p>Give <strong>{{ t.username }}</strong> this temporary password. It's shown only once; they'll choose their own at sign-in.</p>
  <p class="secret" id="pw">{{ password }}</p>
  <button type="button" data-copy="pw">Copy</button>
  <p class="buttons left"><a class="button primary" href="/admin/users/{{ t.id }}">Done</a></p>
</section>
{% endblock %}
