{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ 'Set a new password' if user.must_change_pw else 'Change password' }}</h1>
  {% if user.must_change_pw %}<p class="muted">You signed in with a temporary password. Choose your own to continue.</p>{% endif %}
  <form method="post" action="/password" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
    <label>New password <input name="new" type="password" autocomplete="new-password" minlength="10" required>
      <span class="hint">At least 10 characters.</span></label>
    <label>Confirm new password <input name="confirm" type="password" autocomplete="new-password" minlength="10" required></label>
    <button type="submit" class="primary">Save password</button>
  </form>
</section>
{% endblock %}
