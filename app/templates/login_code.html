{% extends "base.html" %}
{% block title %}Two-step sign-in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Enter your code</h1>
  <p class="muted">Open your authenticator app and enter the 6-digit code for SWA Fare Watcher.</p>
  <form method="post" action="/login/code" class="stack">
    <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="14" required autofocus></label>
    <button type="submit" class="primary">Sign in</button>
  </form>
  <p class="muted small">Lost your phone? Enter one of your recovery codes instead.</p>
</section>
{% endblock %}
