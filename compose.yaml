services:
  watcher:
    build:
      context: .
      # Local builds read the commit and GitHub repo from .git, so the UI shows "dev <commit>"
      additional_contexts:
        git: ./.git
    image: ${IMAGE:-swa-fare-watcher:local}
    env_file:
      - path: .env
        required: false
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR:-./data}:/data      # app.db, secret.key, debug/
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g
    shm_size: 512m
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
